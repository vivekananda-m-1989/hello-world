name: Build Docker Image

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    # ✅ Add this debug step
    - name: Debug project layout
      run: |
        pwd
        ls -la
        echo "==== root pom.xml (top 25 lines) ===="
        sed -n '1,25p' pom.xml
        echo "==== webapp folder ===="
        ls -la webapp || true
        echo "==== webapp/pom.xml (top 25 lines) ===="
        sed -n '1,25p' webapp/pom.xml || true

    # ✅ Build from the root pom explicitly (recommended for multi-module)
    - name: Build with Maven
      run: mvn -B -f pom.xml -pl webapp -am clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: karthikn5005/builddockerimage:latest
